before:
  hooks:
    - go mod tidy
builds:
  -
    id: pgsp-linux
    main: ./cmd/pgsp
    binary: pgsp
    ldflags:
      - -X github.com/EraYaN/pgsp/cmd.Version={{.Version}}
      - -X github.com/EraYaN/pgsp/cmd.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
  -
    id: pgsp-other
    main: ./cmd/pgsp
    binary: pgsp
    ldflags:
      - -X github.com/EraYaN/pgsp/cmd.Version={{.Version}}
      - -X github.com/EraYaN/pgsp/cmd.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
      - freebsd
    goarch:
      - '386'
      - amd64
      - arm
      - arm64

archives:
  -
    id: pgsp-archives
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
    - pgsp-linux
    - pgsp-other
    format: zip

nfpms:
  -
    id: pgsp-nfpms
    file_name_template: "{{ .ProjectName }}_{{ .Version }}-1_{{ .Arch }}"
    builds:
    - pgsp-linux
    homepage: https://github.com/EraYaN/pgsp
    maintainer: Erwin de Haan <git@erayan.com>
    description: PostgreSQL Stat Progress CLI Monitor
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    epoch: 1

